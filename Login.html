<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in - UniTrade</title>
  <link rel="stylesheet" href="Login.css" />
</head>
<body>
  <div class="Login-page">
    <div class="Login-card">
      <h2 class="Login-title">Log in</h2>
      <p class="Login-subtitle">
        Need a UniTrade account?
        <a href="#signup" id="signup-link">Create an account</a>
      </p>

      <p id="Login-success" class="Login-success" hidden></p>

      <form id="Login-form" class="Login-form" novalidate>
        <div class="form-group">
          <label for="email">Username or Email</label>
          <input
            id="email"
            type="text"
            placeholder="Enter your email"
          />
          <span id="email-error" class="field-error" hidden></span>
        </div>

        <div class="form-group">
          <div class="password-header">
            <label for="password">Password</label>
            <button type="button" id="toggle-password" class="toggle-password">
              Show
            </button>
          </div>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
          />
          <span id="password-error" class="field-error" hidden></span>
        </div>

        <div class="checkbox-group">
          <input id="keepLoggedIn" type="checkbox" />
          <label for="keepLoggedIn">Keep me logged in</label>
        </div>

        <button type="submit" class="Login-btn">Log in</button>

        <div class="Login-links">
          <a href="#forgot-user" id="forgot-user-link">Forgot username?</a>
          <a href="#forgot-pass" id="forgot-pass-link">Forgot password?</a>
        </div>
      </form>
    </div>
  </div>

  <script src="Login.js"></script>
</body>
</html>
